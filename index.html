<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIRVANA — Catálogo Verano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow: #F5E003;
    --yellow-dim: #d9c700;
    --black: #0a0a0a;
    --black-2: #141414;
    --grey: #8a8a8a;
    --card: #111111;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--black);
    color: #f2f2f2;
    font-family: 'Archivo', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* HERO */
  .hero{
    position: relative;
    padding: 72px 24px 56px;
    text-align: center;
    overflow: hidden;
    border-bottom: 3px solid var(--yellow);
    background:
      radial-gradient(circle at 50% 0%, rgba(245,224,3,0.08), transparent 60%),
      var(--black);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image: url('img/logo.png');
    background-repeat: no-repeat;
    background-position: center -40px;
    background-size: 260px;
    opacity: 0.06;
    pointer-events:none;
  }
  .hero img.logo{
    width: 150px;
    margin-bottom: 18px;
    filter: drop-shadow(0 0 18px rgba(245,224,3,0.25));
  }
  .hero h1{
    font-family: 'Anton', sans-serif;
    font-size: clamp(2.6rem, 8vw, 4.6rem);
    letter-spacing: 2px;
    color: var(--yellow);
    line-height: 0.95;
    text-transform: uppercase;
  }
  .hero p{
    margin-top: 14px;
    color: var(--grey);
    font-size: 1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* SIZE NAV */
  .size-nav{
    position: sticky; top:0; z-index: 10;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(6px);
    display:flex; justify-content:center; gap: 10px;
    padding: 14px 12px;
    border-bottom: 1px solid #262626;
    flex-wrap: wrap;
  }
  .size-nav a{
    color: #ddd;
    text-decoration:none;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 1px;
    padding: 8px 18px;
    border: 1px solid #333;
    border-radius: 999px;
    transition: all .2s ease;
  }
  .size-nav a:hover{
    border-color: var(--yellow);
    color: var(--yellow);
  }

  /* SECTIONS */
  .section{
    padding: 48px 24px 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .section-title{
    display:flex; align-items:baseline; gap: 14px;
    margin-bottom: 28px;
  }
  .section-title .tag{
    font-family:'Anton', sans-serif;
    font-size: 2.2rem;
    color: var(--black);
    background: var(--yellow);
    padding: 2px 16px;
    letter-spacing: 1px;
  }
  .section-title .count{
    color: var(--grey);
    font-size: 0.9rem;
    letter-spacing: 1px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
  }

  .card{
    background: var(--card);
    border: 1px solid #232323;
    border-radius: 4px;
    overflow: hidden;
    transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover{
    transform: translateY(-4px);
    border-color: var(--yellow);
  }
  .card .img-wrap{
    aspect-ratio: 3/4;
    overflow: hidden;
    background: #1a1a1a;
  }
  .card img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
  }
  .card .info{
    padding: 12px 14px 16px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .card .info .name{
    font-size: 0.8rem;
    color: #ccc;
    letter-spacing: 0.5px;
  }
  .card .info .size-pill{
    font-family:'Anton', sans-serif;
    font-size: 0.8rem;
    background: var(--yellow);
    color: var(--black);
    padding: 3px 10px;
    border-radius: 3px;
    letter-spacing: 1px;
  }

  footer{
    text-align:center;
    padding: 50px 20px 60px;
    color: #555;
    font-size: 0.8rem;
    letter-spacing: 1px;
    border-top: 1px solid #1c1c1c;
    margin-top: 40px;
  }
  footer span{color: var(--yellow);}
</style>
</head>
<body>

  <div class="hero">
    <img class="logo" src="img/logo.png" alt="Nirvana logo">
    <h1>Colección<br>Verano</h1>
    <p>Remeras · Nueva temporada</p>
  </div>

  <nav class="size-nav">
    <a href="#talle-s">Talle S</a>
    <a href="#talle-m">Talle M</a>
    <a href="#talle-l">Talle L</a>
  </nav>

  <section class="section" id="talle-s">
    <div class="section-title">
      <span class="tag">TALLE S</span>
      <span class="count">9 modelos</span>
    </div>
    <div class="grid" id="grid-s"></div>
  </section>

  <section class="section" id="talle-m">
    <div class="section-title">
      <span class="tag">TALLE M</span>
      <span class="count">15 modelos</span>
    </div>
    <div class="grid" id="grid-m"></div>
  </section>

  <section class="section" id="talle-l">
    <div class="section-title">
      <span class="tag">TALLE L</span>
      <span class="count">15 modelos</span>
    </div>
    <div class="grid" id="grid-l"></div>
  </section>

  <footer>
    <span>NIRVANA</span> — Catálogo de muestra. Las imágenes son de referencia.
  </footer>

<script>
  const sFiles = ["IMG_5783","IMG_5786","IMG_5787","IMG_5788","IMG_5789","IMG_5790","IMG_5791","IMG_5792","IMG_5793"];
  const mFiles = ["IMG_5764","IMG_5765","IMG_5766","IMG_5767","IMG_5768","IMG_5769","IMG_5770","IMG_5772","IMG_5773","IMG_5774","IMG_5777","IMG_5778","IMG_5779","IMG_5780","IMG_5781"];
  const lFiles = ["IMG_5732","IMG_5735","IMG_5738","IMG_5741","IMG_5742","IMG_5743","IMG_5745","IMG_5747","IMG_5748","IMG_5749","IMG_5750","IMG_5752","IMG_5753","IMG_5754","IMG_5755"];

  function renderGrid(containerId, folder, files, sizeLabel){
    const grid = document.getElementById(containerId);
    files.forEach((f, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="img-wrap">
          <img src="${folder}${f}.jpeg" alt="Remera ${sizeLabel} ${i+1}" loading="lazy">
        </div>
        <div class="info">
          <span class="name">Remera #${i+1}</span>
          <span class="size-pill">${sizeLabel}</span>
        </div>`;
      grid.appendChild(card);
    });
  }

  renderGrid('grid-s', 'img/', sFiles, 'S');
  renderGrid('grid-m', 'img/M/', mFiles, 'M');
  renderGrid('grid-l', 'img/L/', lFiles, 'L');
</script>

</body>
</html>
