<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIRVANA - Catálogo Verano 26/27</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        .header {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid #ffff00;
        }

        .logo-section {
            margin-bottom: 20px;
        }

        .logo {
            max-width: 300px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .catalog-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .catalog-subtitle {
            font-size: 14px;
            color: #ffff00;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .size-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding: 25px 20px;
            background: #1a1a1a;
            flex-wrap: wrap;
        }

        .size-btn {
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 700;
            border: 2px solid #333;
            background: transparent;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .size-btn:hover {
            border-color: #ffff00;
            color: #ffff00;
        }

        .size-btn.active {
            background: #ffff00;
            color: #000;
            border-color: #ffff00;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .product-card {
            background: #1a1a1a;
            border: 1px solid #333;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            border-color: #ffff00;
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #000;
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-number {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .season-badge {
            display: inline-block;
            background: #ffff00;
            color: #000;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
                padding: 20px 15px;
            }

            .product-image {
                height: 200px;
            }

            .catalog-title {
                font-size: 24px;
            }

            .size-selector {
                padding: 20px 15px;
                gap: 10px;
            }

            .size-btn {
                padding: 10px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-section">
            <img src="logo-nirvana.png" alt="NIRVANA Logo" class="logo">
        </div>
        <div class="catalog-title">NIRVANA</div>
        <div class="catalog-subtitle">Catálogo Verano 26/27</div>
    </div>

    <div class="size-selector">
        <button class="size-btn" onclick="filterBySize('S')">S</button>
        <button class="size-btn" onclick="filterBySize('M')">M</button>
        <button class="size-btn" onclick="filterBySize('L')">L</button>
        <button class="size-btn active" onclick="filterBySize('XL')">XL</button>

            ]
        };

        let currentSize = 'XL';

        function filterBySize(size) {
            currentSize = size;
            
            // Actualizar botones activos
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const items = products[currentSize] || [];
            
            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📸</div>
                        <p>Imágenes de talle ${currentSize} pendientes...</p>
                        <p style="font-size: 12px; color: #666; margin-top: 10px;">Envía las fotos para completar el catálogo</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = items.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <div class="product-number">Item #${String(product.id).padStart(3, '0')}</div>
                        <div class="season-badge">${currentSize}</div>
                    </div>
                </div>
            `).join('');
        }

        // Renderizar productos al cargar
        renderProducts();
    </script>
</body>
